<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css">
<title>Strona Zamówienia</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 2rem auto;
    padding: 1rem;
    background-color: #b41010;
  }
  h1 {
    text-align: center;
  }
  form {
    background: white;
    padding: 1.5rem;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  label {
    display: block;
    margin-top: 1rem;
    font-weight: bold;
  }
  input, select, textarea {
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.3rem;
    border: 1px solid #ccc;
    border-radius: 3px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  button {
    margin-top: 1.5rem;
    background-color: #007bff;
    color: white;
    padding: 0.7rem 1.5rem;
    border: none;
    border-radius: 3px;
    font-size: 1.1rem;
    cursor: pointer;
    width: 100%;
  }
  button:hover {
    background-color: #0056b3;
  }
</style>
</head>
<body>
    <ul class="menu">
<li><a href="index.html">menu</a></li>
    </ul>
<h1>Zamówienie</h1>
<form id="orderForm">
  <label for="name">Imię i nazwisko:</label>
  <input type="text" id="name" name="name" required placeholder="Wpisz swoje imię i nazwisko" />

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required placeholder="Wpisz swój adres email" />

  <label for="product">Wybierz produkt:</label>
  <select id="product" name="product" required>
    <option value="" disabled selected>-- wybierz produkt --</option>
    <option value="produkt1">Produkt 1</option>
    <option value="produkt2">Produkt 2</option>
    <option value="produkt3">Produkt 3</option>
    <option value="produkt4">Produkt 4</option>
    <option value="produkt5">Produkt 5</option>
    <option value="produkt6">Produkt 6</option>
  </select>

  <label for="quantity">Ilość:</label>
  <input type="number" id="quantity" name="quantity" min="1" value="1" required />

  <label for="address">Adres dostawy:</label>
  <textarea id="address" name="address" rows="3" required placeholder="Wpisz adres dostawy"></textarea>

  <button type="submit">Złóż zamówienie</button>
</form>

<script>
  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = this.name.value.trim();
    const email = this.email.value.trim();
    const product = this.product.value;
    const quantity = this.quantity.value;
    const address = this.address.value.trim();

    if(!name || !email || !product || !quantity || !address) {
      alert('Proszę wypełnić wszystkie pola!');
      return;
    }

    alert(`Dziękujemy za zamówienie, ${name}!\n
Produkt: ${product}\n
Ilość: ${quantity}\n
Adres dostawy: ${address}`);

    this.reset();
  });
</script>

</body>
</html>
